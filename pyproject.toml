[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aesthetic-wallpapers"
version = "1.0.0"
description = "Aesthetic wallpaper collection with image processing utilities"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.9",
    "flake8>=7.0",
    "types-requests>=2.31",
    "types-Pillow>=10.0",
]

[project.scripts]
wallpaper-processor = "wallpaper_processor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*.py"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
show_missing = true

# ---------------------------------------------------------------------------
# flake8 (via setup.cfg or tox.ini; listed here for reference)
# ---------------------------------------------------------------------------
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
